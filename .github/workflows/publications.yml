name: Build Portfolio Data

on:
  workflow_dispatch:
  push:
    paths:
      - "content/**"
      - "scripts/build_portfolio_data.js"

permissions:
  contents: write

jobs:
  build-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate portfolio data
        run: node scripts/build_portfolio_data.js

      - name: Commit generated data
        run: |
          if git diff --quiet -- generated/portfolio-data.js; then
            echo "Generated portfolio data is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generated/portfolio-data.js
          git commit -m "Build portfolio data"
          git push
